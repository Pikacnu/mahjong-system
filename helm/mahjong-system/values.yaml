replicaCount: 1
imagePullSecrets: []

services:
  function-storage:
    enabled: true
    image:
      repository: pikacnu/function-storage
      tag: latest
    # gRPC server binds PORT; callers dial GRPC_PORT (4001)
    port: 4001
    resources: {}
  function-runner:
    enabled: true
    image:
      repository: pikacnu/function-runner
      tag: latest
    # gRPC server binds PORT; callers dial GRPC_PORT (4001)
    port: 4001
    resources: {}
  game-runner:
    enabled: true
    image:
      repository: pikacnu/game-runner
      tag: latest
    # HTTP port is unused; the gRPC server binds GRPC_PORT
    port: 3000
    grpcPort: 4001
    resources: {}
  api-server:
    enabled: true
    image:
      repository: pikacnu/api-server
      tag: latest
    port: 3000
    resources: {}
  lobby-server:
    enabled: true
    image:
      repository: pikacnu/lobby-server
      tag: latest
    port: 3001
    resources: {}

postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: postgres
    tag: "18"
  port: 5432
  username: mahjong
  password: mahjongpassword
  database: mahjongdb
  # Optional initialization scripts that will be mounted into
  # /docker-entrypoint-initdb.d in the postgres container. Provide a
  # map of filename: script-content. Example:
  # initdbScripts:
  #   01-init-schema.sql: |-
  #     -- SQL initialization example (executed by POSTGRES_USER)
  #     CREATE USER docker;
  #     CREATE DATABASE docker;
  #     GRANT ALL PRIVILEGES ON DATABASE docker TO docker;
  initdbScripts: {}
  persistence:
    enabled: true
    size: 1Gi

# Migrations run at startup in function-storage and api-server, so this Job is off by default.
migrations:
  enabled: false
  image:
    repository: pikacnu/function-storage
    tag: latest
  command:
    - "sh"
    - "-c"
    - "echo no migrations configured; exit 0"

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
