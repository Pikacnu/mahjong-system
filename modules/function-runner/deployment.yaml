# Standalone manifest for function-runner. Temporary: function-runner is being removed
# (see modules/utils/docs/plugin-runtime-design.md). Matches the current code:
# - the gRPC server binds PORT, and game-server dials PLUGIN_RUNNER_HOSTNAME:GRPC_PORT (4001)
# - there is no HTTP server, so probes are TCP probes on the gRPC port
apiVersion: apps/v1
kind: Deployment
metadata:
  name: function-runner
  namespace: default
  labels:
    app: function-runner
spec:
  replicas: 3
  selector:
    matchLabels:
      app: function-runner
  template:
    metadata:
      labels:
        app: function-runner
    spec:
      runtimeClassName: kata
      containers:
        - name: function-runner
          image: function-runner:latest
          imagePullPolicy: Always
          ports:
            - name: grpc
              containerPort: 4001
              protocol: TCP
          env:
            - name: PORT
              value: "4001"
            - name: GRPC_PORT
              value: "4001"
            - name: STORAGE_HOSTNAME
              value: "function-storage"
            - name: WORKER_MEMORY_LIMIT
              value: "25165824" # 24MB
            - name: TASK_TIMEOUT_MS
              value: "5000"
            - name: VM_MAX_STACK_SIZE
              value: "1048576"
            - name: VM_EXECUTION_TIMEOUT_MS
              value: "5000"
            - name: MAX_WORKERS
              value: "8"
            - name: MIN_WORKERS
              value: "1"
            - name: MAX_TASKS_PER_WORKER
              value: "1"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - function-runner
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: function-runner
  namespace: default
  labels:
    app: function-runner
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 4001
      targetPort: grpc
      protocol: TCP
  selector:
    app: function-runner
